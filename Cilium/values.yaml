bgpControlPlane:
    enabled: true

# Listening on the default BGP port (179) requires NET_BIND_SERVICE. If you wish to use the default port, you must grant the NET_BIND_SERVICE capability with securityContext.capabilities.ciliumAgent Helm value.
securityContext:
  capabilities:
    ciliumAgent: ["CHOWN","KILL","NET_ADMIN","NET_RAW","IPC_LOCK","SYS_MODULE","SYS_ADMIN","SYS_RESOURCE","DAC_OVERRIDE","FOWNER","SETGID","SETUID","SYSLOG", "NET_BIND_SERVICE"]
