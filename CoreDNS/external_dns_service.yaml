apiVersion: v1
kind: Service
# Allows external (pfsense) access to core dns service for lookup of LoadBalancer-services
metadata:
  name: ext-dns
  namespace: kube-system
  annotations:
    "lbipam.cilium.io/ips": "192.168.32.1" # https://docs.cilium.io/en/stable/network/lb-ipam/#requesting-ips
    "lbipam.cilium.io/sharing-key": "DNS" # https://docs.cilium.io/en/stable/network/lb-ipam/#sharing-keys
spec:
  type: LoadBalancer
  ports:
    - name: dns
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
  selector:
    k8s-app: kube-dns