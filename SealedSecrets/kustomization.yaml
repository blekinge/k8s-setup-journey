apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system

helmCharts:
  - name: sealed-secrets
    releaseName: sealed-secrets
    namespace: kube-system
    repo: https://bitnami.github.io/sealed-secrets
    includeCRDs: true
    version: 2.19.1
    valuesFile: values.yaml

resources:
  - namespace.yaml
