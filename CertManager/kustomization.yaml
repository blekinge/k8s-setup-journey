apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
helmCharts:
  - name: simply-dns-webhook
    releaseName: simply-dns-webhook
    namespace: cert-manager
    repo: https://runnerm.github.io/simply-dns-webhook/
    includeCRDs: true
    version: 1.9.0
  - name: cert-manager
    releaseName: cert-manager
    namespace: cert-manager
    repo: https://charts.jetstack.io
    includeCRDs: true
    version: 1.18.2
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - clusterissuer-askov.net.yaml
  - secret-simply-askov.net.yaml
